<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>POS - نقطة البيع</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1><i class="fas fa-cash-register"></i> نقطة البيع - اختر منتجاً</h1>
        <div class="header-buttons">
            <a href="inventory.html" class="btn-icon"><i class="fas fa-boxes"></i> إدارة المنتجات</a>
            <button id="resetDayBtn" class="btn-icon"><i class="fas fa-undo-alt"></i> مسح اليوم</button>
        </div>
    </header>

    <div class="pos-main">
        <!-- القسم الأيمن: قائمة المنتجات (حلّت مكان البحث) -->
        <div class="products-section">
            <div class="card">
                <h3><i class="fas fa-tags"></i> المنتجات المتاحة</h3>
                <div class="search-mini">
                    <input type="text" id="productSearchInput" placeholder="بحث سريع عن منتج..." autocomplete="off">
                </div>
                <div id="productsGrid" class="products-grid">
                    <!-- هون راح تظهر المنتجات بشكل أزرار -->
                </div>
            </div>
        </div>

        <!-- القسم الأيسر: سلة المشتريات والإجماليات -->
        <div class="summary-section">
            <div class="card cart-card">
                <h3><i class="fas fa-shopping-cart"></i> سلة المشتريات</h3>
                <div class="table-responsive">
                    <table class="cart-table">
                        <thead>
                            <tr><th>المنتج</th><th>سعر البيع</th><th>الكمية</th><th>الإجمالي</th><th></th></tr>
                        </thead>
                        <tbody id="cartBody">
                            <tr><td colspan="5">⚠️ السلة فارغة</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card totals-card">
                <h3><i class="fas fa-chart-line"></i> ملخص الفاتورة</h3>
                <div class="total-row"><span>💰 إجمالي المبيعات:</span><span id="totalSalesSpan">0.00</span></div>
                <div class="total-row profit-row"><span>✨ إجمالي الربح:</span><span id="totalProfitSpan">0.00</span></div>
                <div class="total-row final-row"><span>💵 المطلوب من العميل:</span><span id="finalTotalSpan">0.00</span></div>
                <button id="checkoutBtn" class="btn-success"><i class="fas fa-check-circle"></i> إنهاء البيع</button>
            </div>
            
            <div class="card sold-card">
                <h3><i class="fas fa-clipboard-list"></i> مبيعات اليوم</h3>
                <div id="soldItemsList" class="sold-list"></div>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
