<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1><i class="fas fa-boxes"></i> إدارة المنتجات</h1>
        <div class="header-buttons">
            <a href="index.html" class="btn-icon"><i class="fas fa-cash-register"></i> نقطة البيع</a>
        </div>
    </header>

    <div class="inventory-main">
        <!-- نموذج إضافة/تعديل منتج -->
        <div class="card form-card">
            <h3><i class="fas fa-plus-circle"></i> إضافة منتج جديد</h3>
            <div class="form-grid">
                <input type="text" id="prodBarcode" placeholder="الباركود (رقم فريد)" autocomplete="off">
                <input type="text" id="prodName" placeholder="اسم المنتج" autocomplete="off">
                <input type="number" id="prodCost" placeholder="سعر الشراء" autocomplete="off">
                <input type="number" id="prodPrice" placeholder="سعر البيع" autocomplete="off">
                <input type="number" id="prodStock" placeholder="الكمية المتوفرة" autocomplete="off" value="0">
                <button id="saveProductBtn" class="btn-primary"><i class="fas fa-save"></i> حفظ المنتج</button>
            </div>
            <div id="formMessage" class="form-message"></div>
        </div>

        <!-- قائمة المنتجات -->
        <div class="card products-card">
            <h3><i class="fas fa-list"></i> قائمة المنتجات</h3>
            <div class="search-bar">
                <input type="text" id="searchProducts" placeholder="بحث بالاسم أو الباركود...">
            </div>
            <div class="table-responsive">
                <table class="products-table">
                    <thead>
                        <tr><th>الباركود</th><th>الاسم</th><th>سعر الشراء</th><th>سعر البيع</th><th>المخزون</th><th></th></tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
