<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المخزون | المنتجات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="app-wrapper">
    <nav class="glass-nav">
        <div class="logo">
            <i class="fas fa-boxes"></i>
            <span>إدارة <span class="light">المنتجات</span></span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="nav-btn"><i class="fas fa-cash-register"></i><span>نقطة البيع</span></a>
        </div>
    </nav>

    <div class="inventory-container">
        <!-- نموذج إضافة منتج (بدون مخزون) -->
        <div class="form-card-modern">
            <div class="form-header">
                <i class="fas fa-plus-circle"></i>
                <h3>إضافة منتج جديد</h3>
            </div>
            <div class="modern-form">
                <div class="input-group-modern">
                    <i class="fas fa-barcode"></i>
                    <input type="text" id="prodBarcode" placeholder="الباركود (رقم فريد)">
                </div>
                <div class="input-group-modern">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="prodName" placeholder="اسم المنتج">
                </div>
                <div class="input-group-modern">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" id="prodCost" placeholder="سعر الشراء">
                </div>
                <div class="input-group-modern">
                    <i class="fas fa-money-bill"></i>
                    <input type="number" id="prodPrice" placeholder="سعر البيع">
                </div>
                <button id="saveProductBtn" class="gradient-btn"><i class="fas fa-save"></i> حفظ المنتج</button>
            </div>
            <div id="formMessage" class="form-message"></div>
        </div>

        <!-- جدول المنتجات (بدون عمود المخزون) -->
        <div class="table-card">
            <div class="table-header">
                <i class="fas fa-list-ul"></i>
                <h3>قائمة المنتجات</h3>
                <div class="search-mini">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchProducts" placeholder="بحث ...">
                </div>
            </div>
            <div class="table-responsive">
                <table class="modern-table">
                    <thead>
                        <tr><th>الباركود</th><th>الاسم</th><th>سعر الشراء</th><th>سعر البيع</th><th>إجراء</th></tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
